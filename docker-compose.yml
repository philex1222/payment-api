services:
  # Temporal — durable workflow server (auto-setup handles schema migration)
  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: payment-temporal
    environment:
      - DB=sqlite
    ports:
      - "7233:7233"
    networks:
      - payment-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: payment-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_started
    networks:
      - payment-network
    restart: unless-stopped

  # Payment API Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=86400000
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      # Zipkin is optional — tracing is non-critical so a slow Zipkin start
      # should not block the app from coming up.
      zipkin:
        condition: service_started
    networks:
      - payment-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'

  # MySQL Database
  mysql:
    image: mysql:8.4.8
    container_name: payment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: payment_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - payment-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  # Redis Cache — password-protected
  redis:
    image: redis:7.4.2-alpine
    container_name: payment-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - payment-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'

  # Prometheus — metrics scraping
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: payment-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "19090:9090"
    depends_on:
      - app
    networks:
      - payment-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # Grafana — metrics visualisation
  grafana:
    image: grafana/grafana:11.6.14
    container_name: payment-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - payment-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # Zipkin distributed tracing UI & collector
  zipkin:
    image: openzipkin/zipkin:3
    container_name: payment-zipkin
    ports:
      - "9411:9411"
    networks:
      - payment-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  payment-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
