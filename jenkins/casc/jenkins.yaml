# =============================================================================
# Jenkins Configuration as Code (JCasC)
#
# Auto-applied on every controller startup via CASC_JENKINS_CONFIG env var.
# Configures: security, tools, and the multibranch pipeline job.
#
# Default login: admin / admin  (change IMMEDIATELY in production)
# =============================================================================

jenkins:
  systemMessage: |
    payment-api CI/CD — Jenkins
    Pipeline source: https://github.com/philex1222/payment-api
    Managed by Configuration as Code.

  # ── Executor count ────────────────────────────────────────────────────────
  numExecutors: 0   # Controller runs zero jobs; all work goes to the agent

  # ── Build agent node ──────────────────────────────────────────────────────
  # Pre-registers the inbound agent so its JNLP secret is available as soon
  # as the controller starts — the entrypoint.sh script fetches it automatically.
  nodes:
    - permanent:
        name: "payment-api-agent"
        nodeDescription: "payment-api CI/CD build agent (Docker)"
        labelString: "payment-api-agent"
        numExecutors: 2
        remoteFS: "/home/jenkins/workspace"
        launcher:
          inbound: {}
        retentionStrategy: "always"

  # ── Security realm — local accounts ──────────────────────────────────────
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          # Plain-text password for local dev — JCasC hashes it on first apply.
          # Change this before exposing Jenkins outside localhost.
          password: "admin"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # ── Agent protocol ────────────────────────────────────────────────────────
  remotingSecurity:
    enabled: true

# ── Global tool configuration ─────────────────────────────────────────────────
# Tools are pre-installed in the agent Docker image (jenkins/agent/Dockerfile).
# Using fixed paths avoids any installer plugin dependency.
tool:
  jdk:
    installations:
      - name: "temurin-21"
        home: "/opt/java/openjdk"   # Eclipse Temurin 21 in eclipse-temurin:21-jdk-jammy
  maven:
    installations:
      - name: "maven-3.9"
        home: "/opt/maven"          # Maven 3.9.9 installed by the agent Dockerfile

# ── Pipeline job ──────────────────────────────────────────────────────────────
# The multibranch pipeline job is created manually after first boot:
#   New Item → payment-api → Multibranch Pipeline
#   Branch Sources → GitHub: owner=philex1222, repo=payment-api, creds=ghcr-credentials
#   Build Configuration → Script Path: Jenkinsfile
# See jenkins/README.md for full instructions.
