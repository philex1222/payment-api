# =============================================================================
# Jenkins Configuration as Code (JCasC)
#
# Auto-applied on every controller startup via CASC_JENKINS_CONFIG env var.
# Configures: security, tools, and the multibranch pipeline job.
#
# Default login: admin / admin  (change IMMEDIATELY in production)
# =============================================================================

jenkins:
  systemMessage: |
    payment-api CI/CD — Jenkins
    Pipeline source: https://github.com/philex1222/payment-api
    Managed by Configuration as Code.

  # ── Executor count ────────────────────────────────────────────────────────
  numExecutors: 0   # Controller runs zero jobs; all work goes to the agent

  # ── Security realm — local accounts ──────────────────────────────────────
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          # BCrypt of "admin" — change this password after first login
          password: "$2a$10$DowJonesInd3xP4ssw0rd123456789012345678901234567890"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # ── Agent protocol ────────────────────────────────────────────────────────
  remotingSecurity:
    enabled: true

# ── Global tool configuration ─────────────────────────────────────────────────
tool:
  jdk:
    installations:
      - name: "temurin-17"
        properties:
          - installSource:
              installers:
                - adoptOpenJdkInstaller:
                    id: "jdk-17.0.12+7"
  maven:
    installations:
      - name: "maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

# ── Pipeline job definition ───────────────────────────────────────────────────
jobs:
  - script: |
      multibranchPipelineJob('payment-api') {
        displayName('payment-api — CI/CD Pipeline')
        description('Declarative Jenkins pipeline for payment-api. Scans all branches for Jenkinsfile.')

        branchSources {
          github {
            id('payment-api-source')
            repoOwner('philex1222')
            repository('payment-api')
            repositoryUrl('https://github.com/philex1222/payment-api.git')
            credentialsId('ghcr-credentials')
          }
        }

        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }

        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }

        triggers {
          periodicFolderTrigger {
            interval('1h')
          }
        }
      }
