# =============================================================================
# Jenkins local stack — controller + build agent
#
# Start:  docker compose -f jenkins/docker-compose.yml up -d
# Stop:   docker compose -f jenkins/docker-compose.yml down
# Logs:   docker compose -f jenkins/docker-compose.yml logs -f
#
# Jenkins UI: http://localhost:9090
# Initial admin password: docker exec jenkins-controller cat /var/jenkins_home/secrets/initialAdminPassword
# =============================================================================

services:

  # ── Jenkins Controller ──────────────────────────────────────────────────────
  # Built from Dockerfile.controller: jenkins/jenkins:latest + pre-installed
  # plugins so JCasC (jenkins.yaml) applies automatically on first boot.
  jenkins-controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "9090:8080"    # Web UI  → http://localhost:9090
      - "50000:50000"  # Agent JNLP inbound port
    volumes:
      - jenkins-home:/var/jenkins_home
      # Mount the JCasC config so tools are auto-configured on first boot
      - ./casc:/var/jenkins_casc_configs:ro
    environment:
      # Tell Jenkins where its own URL is (needed for agent connections)
      JENKINS_URL: "http://jenkins-controller:8080"
      # JCasC: auto-apply jenkins.yaml on every startup
      CASC_JENKINS_CONFIG: "/var/jenkins_casc_configs/jenkins.yaml"
      # Skip the setup wizard since JCasC handles configuration
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Xmx1g
    networks:
      - jenkins-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Jenkins Build Agent ──────────────────────────────────────────────────────
  # Built from jenkins/agent/Dockerfile.
  # Mounts the host Docker socket so the pipeline can build and scan images.
  jenkins-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jenkins-agent
    restart: unless-stopped
    depends_on:
      jenkins-controller:
        condition: service_healthy
    volumes:
      # Docker socket — lets the agent run docker build / docker push
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent Maven cache — avoids re-downloading deps on every build
      - maven-cache:/home/jenkins/.m2
    environment:
      JENKINS_URL:        "http://jenkins-controller:8080"
      JENKINS_AGENT_NAME: "payment-api-agent"
      # JENKINS_SECRET is generated by the controller after it starts.
      # Set it here OR use the manual registration steps in README.md.
      # Leave blank on first run — see "Step 4" in the guide below.
      JENKINS_SECRET:     "${JENKINS_AGENT_SECRET:-}"
      JENKINS_AGENT_WORKDIR: "/home/jenkins/workspace"
    networks:
      - jenkins-net
    user: "1000:1000"

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  jenkins-home:
    name: payment-api-jenkins-home
  maven-cache:
    name: payment-api-maven-cache

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  jenkins-net:
    name: payment-api-jenkins-net
