# ─── Cucumber JUnit Platform Engine configuration ───────────────────────────
# Glue path: Spring config + all step definitions
cucumber.glue=com.example.paymentapi.bdd

# Feature file root (classpath-relative)
cucumber.features=classpath:features

# Plugins: console output + HTML report + JSON for CI artifact
cucumber.plugin=pretty,html:target/cucumber-reports/cucumber.html,json:target/cucumber-reports/cucumber.json

# Suppress the Cucumber publish banner
cucumber.publish.quiet=true
