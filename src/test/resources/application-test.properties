# =============================================================================
# Test Database (H2 in-memory with MySQL compatibility mode)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway is disabled in tests; Hibernate manages the H2 schema via ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (debug only)
spring.h2.console.enabled=true

# =============================================================================
# Cache — use simple in-memory cache (no Redis required in tests)
# =============================================================================
spring.cache.type=simple
management.health.redis.enabled=false

# =============================================================================
# HikariCP — minimal pool for tests (no parallelism needed)
# =============================================================================
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# =============================================================================
# JPA — catch N+1 and batch issues early in tests
# =============================================================================
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# =============================================================================
# Logging
# =============================================================================
logging.level.root=WARN
logging.level.com.example.paymentapi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =============================================================================
# JWT
# =============================================================================
jwt.secret=test-jwt-secret-key-for-testing-purposes-only-must-be-64-chars-12345678
jwt.expiration=3600000

# =============================================================================
# Rate Limiting — relaxed for tests (prevents exhaustion across @BeforeEach login calls)
# =============================================================================
rate-limit.limit=10000
rate-limit.refreshPeriod=60000
rate-limit.timeout=1000
rate-limit.login.limit=10000
rate-limit.login.refreshPeriod=60000

# =============================================================================
# Actuator
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =============================================================================
# Resilience4j — disabled in tests to avoid interference
# =============================================================================
resilience4j.circuitbreaker.instances.bankingApi.sliding-window-size=100
resilience4j.circuitbreaker.instances.bankingApi.failure-rate-threshold=100
resilience4j.retry.instances.bankingApi.max-attempts=1

# =============================================================================
# Distributed Tracing — disabled in tests (no Zipkin server available)
# =============================================================================
management.tracing.sampling.probability=0.0

# =============================================================================
# Scheduler — disabled in tests to prevent background jobs interfering
# =============================================================================
scheduler.enabled=false
