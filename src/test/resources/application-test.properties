# Test Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (optional for debugging)
spring.h2.console.enabled=true

# Redis Configuration for Tests - use mock
spring.redis.host=localhost
spring.redis.port=6379

# Disable Redis cache, use simple in-memory cache
spring.cache.type=simple

# Logging
logging.level.root=WARN
logging.level.com.example.paymentapi=DEBUG

# JWT Configuration
jwt.secret=test-jwt-secret-key-for-testing-purposes-only-must-be-long-enough
jwt.expiration=3600000

# Rate Limiting - relaxed for tests
rate-limit.limit=10000
rate-limit.refreshPeriod=60000
rate-limit.timeout=1000

# Management Endpoints - expose both health and info for tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.redis.enabled=false

# Fix for Springfox compatibility with Spring Boot 2.6+
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
