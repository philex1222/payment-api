# =============================================================================
# Docker / Production profile
# Active when: SPRING_PROFILES_ACTIVE=docker (set by docker-compose.yml)
#
# Overrides the base application.properties with production-hardened settings.
# All credentials must be supplied via environment variables — no fallback
# defaults are provided here so a missing secret fails fast at startup rather
# than silently using an insecure default.
# =============================================================================

# =============================================================================
# Data Source — credentials supplied via environment variables only.
# Spring Boot maps SPRING_DATASOURCE_* env vars set in docker-compose.yml,
# so explicit property entries here are intentionally omitted.  Flyway runs
# migrations on first start; baseline-on-migrate handles existing schemas.
# =============================================================================
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# H2 console — must be OFF in production
# =============================================================================
spring.h2.console.enabled=false

# =============================================================================
# HikariCP — production pool sizes
# =============================================================================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

# =============================================================================
# Redis cache — type is auto-configured to Redis when spring-data-redis is
# on the classpath and a connection factory is available.
# =============================================================================
spring.cache.type=redis
management.health.redis.enabled=true

# =============================================================================
# Actuator — expose only the endpoints needed in production
# =============================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers
management.endpoint.health.show-details=always

# =============================================================================
# Logging — structured JSON output for log aggregation (ELK / Grafana Loki).
# The logback-spring.xml profile "!test" activates the JSON appender when
# this profile is active.
# =============================================================================
logging.level.root=INFO
logging.level.com.example.paymentapi=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN

# =============================================================================
# Scheduler — enabled in production
# =============================================================================
scheduler.enabled=true

# =============================================================================
# Tracing — 10% sampling rate in production to limit Zipkin overhead.
# Override per deployment via MANAGEMENT_TRACING_SAMPLING_PROBABILITY env var.
# =============================================================================
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# =============================================================================
# Webhook encryption key — MUST be set via environment variable in production.
# Set WEBHOOK_ENCRYPTION_KEY in docker-compose.yml or Kubernetes secret.
# Generate with: openssl rand -base64 32
# =============================================================================
