# =============================================================================
# Test profile — activated by @ActiveProfiles("test") on all Spring Boot tests.
# Uses H2 in-memory database (same as local profile but with test-safe overrides).
# =============================================================================

# =============================================================================
# Database — H2 in-memory (MySQL compatibility mode, separate from local DB)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false
spring.h2.console.enabled=false

# =============================================================================
# HikariCP — minimal pool for tests
# =============================================================================
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# =============================================================================
# Cache — in-memory (TestConfig provides a ConcurrentMapCacheManager override)
# =============================================================================
spring.cache.type=simple
management.health.redis.enabled=false

# =============================================================================
# Test fixtures — seeded users and deterministic dev-key fallback are test-only
# =============================================================================
app.seed.default-users=true
webhook.encryption.allow-dev-key=true

# =============================================================================
# JWT — test-only secret (base application.properties no longer has a fallback)
# =============================================================================
jwt.secret=test-only-secret-must-be-at-least-64-chars-for-hs512-compliance-padding-aa

# =============================================================================
# Distributed Tracing — disabled in tests
# =============================================================================
management.tracing.sampling.probability=0.0

# =============================================================================
# Scheduler — disabled to avoid background noise
# =============================================================================
scheduler.enabled=false

# =============================================================================
# Rate limiting — generous limits for tests (prevents test isolation issues
# caused by shared in-memory rate-limiter state across @BeforeEach login calls)
# =============================================================================
rate-limit.limit=10000
rate-limit.refreshPeriod=60000
rate-limit.timeout=1000
rate-limit.login.limit=10000
rate-limit.login.refreshPeriod=60000
