# =============================================================================
# Local development profile — no external services required.
# Active automatically when using: mvn spring-boot:run
# (spring-boot-maven-plugin is configured to activate this profile by default)
#
# Uses H2 in-memory database with MySQL compatibility mode.
# Flyway is disabled; Hibernate creates the schema via ddl-auto=create-drop.
# Redis is replaced by a simple in-memory cache.
# Zipkin tracing is disabled.
# =============================================================================

# =============================================================================
# Database — H2 in-memory (MySQL compatibility mode)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway disabled — H2 schema is managed by Hibernate
spring.flyway.enabled=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:localdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
# HikariCP — minimal pool for local dev
# =============================================================================
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# =============================================================================
# Cache — simple in-memory (no Redis required)
# =============================================================================
spring.cache.type=simple
management.health.redis.enabled=false

# =============================================================================
# Distributed Tracing — disabled (no Zipkin server)
# =============================================================================
management.tracing.sampling.probability=0.0

# =============================================================================
# Logging — verbose for development
# =============================================================================
logging.level.com.example.paymentapi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =============================================================================
# Scheduler — disabled to avoid background noise during dev
# =============================================================================
scheduler.enabled=false

# =============================================================================
# JWT — insecure dev-only secret (application.properties has no fallback so
# this profile property provides the value for local runs and IDE launches).
# NEVER use this value outside of local development.
# =============================================================================
jwt.secret=change-me-in-local-dev-only-not-for-production-must-be-64-chars-for-hs512-aaaaaa

# =============================================================================
# Actuator — expose all endpoints for local debugging
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,beans,env
management.endpoint.health.show-details=always
