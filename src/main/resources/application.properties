# =============================================================================
# Default active profile — activates the 'local' profile (H2, no Redis, no
# Zipkin) when no explicit profile is set. This covers ALL launch methods:
# IDE run configurations, 'java -jar', and 'mvn spring-boot:run'.
#
# Overridden at runtime by:
#   docker-compose.yml  → SPRING_PROFILES_ACTIVE=docker
#   Tests               → @ActiveProfiles("test")
#   Manual override     → -Dspring.profiles.active=<profile>
# =============================================================================
spring.profiles.default=local

# =============================================================================
# Data Source (MySQL)
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payment_db?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

# =============================================================================
# HikariCP Connection Pool
# =============================================================================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=PaymentApiHikariPool
spring.datasource.hikari.auto-commit=false

# =============================================================================
# Redis
# =============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# =============================================================================
# Logging (structured — includes MDC correlationId)
# =============================================================================
logging.level.root=INFO
logging.level.com.example.paymentapi=INFO
logging.file.path=${LOGGING_FILE_PATH:./logs/payment-api}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n

# =============================================================================
# Actuator — health & info are public; all other endpoints require ADMIN role
# (secured via SecurityConfig.filterChain)
# =============================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.redis.enabled=true
management.health.circuitbreakers.enabled=true
# Kubernetes liveness and readiness probe paths
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =============================================================================
# Rate Limiting
# =============================================================================
rate-limit.limit=100
rate-limit.refreshPeriod=60000
rate-limit.timeout=1000

# =============================================================================
# JWT — secret MUST be provided via env var in production (min 64 bytes for HS512).
# The fallback below is for LOCAL DEVELOPMENT ONLY. Docker/production deployments
# must set JWT_SECRET to a strong secret (openssl rand -hex 64).
# =============================================================================
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-64-chars-for-hs512-compliance}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# Resilience4j — circuit breaker + retry + timelimiter for bankingApi
# =============================================================================
resilience4j.circuitbreaker.instances.bankingApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bankingApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.bankingApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bankingApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.bankingApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bankingApi.register-health-indicator=true

resilience4j.retry.instances.bankingApi.max-attempts=3
resilience4j.retry.instances.bankingApi.wait-duration=500ms
resilience4j.retry.instances.bankingApi.enable-exponential-backoff=true
resilience4j.retry.instances.bankingApi.exponential-backoff-multiplier=2

resilience4j.timelimiter.instances.bankingApi.timeout-duration=5s
resilience4j.timelimiter.instances.bankingApi.cancel-running-future=true

# =============================================================================
# Distributed Tracing (Micrometer Tracing + Zipkin)
# =============================================================================
# Sample 100% of requests in dev/staging; lower to 0.1 in high-traffic production
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# =============================================================================
# JPA / Hibernate — batch writes, N+1 guard, query safety
# =============================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# =============================================================================
# Tomcat tuning
# 80 worker threads is appropriate for a 1g container handling payment workloads.
# The default of 200 is sized for large VMs and wastes memory in containers.
# =============================================================================
server.tomcat.threads.max=80
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# =============================================================================
# MVC — throw NoHandlerFoundException so the global handler returns 404
# =============================================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =============================================================================
# CORS — override origins via CORS_ALLOWED_ORIGINS env var in production
# =============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# =============================================================================
# Scheduler — failed-payment retry job
# =============================================================================
scheduler.enabled=true
scheduler.retry.max-attempts=3
scheduler.retry.fixed-delay-ms=60000
scheduler.cleanup.cron=0 0 2 * * ?
scheduler.cleanup.audit-log-retention-days=90
scheduler.cleanup.payment-retention-days=30
