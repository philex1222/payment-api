name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip bot-authored PRs (Dependabot, Renovate, etc.) — Claude review is
    # only meaningful for human-authored changes.
    if: github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    # continue-on-error: quota exhaustion or transient API failures should not
    # block a PR from merging — the review is advisory, not a gate.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write  # post inline review comments and submit review
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@e58dfa55559035499a4982426bb73605e8b5ad8e # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
