name: Security — Scheduled Deep Scan

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Full OWASP Dependency-Check (all severities reported) ────────────────
  owasp-full-scan:
    name: OWASP Full Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Cache OWASP NVD data directory
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Set OWASP Dependency-Check arguments
        id: owasp-args
        shell: bash
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS="--enableRetired --enableExperimental"
          if [ -n "$NVD_KEY" ]; then
            ARGS="$ARGS --nvdApiKey $NVD_KEY"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run OWASP Dependency-Check (all severities)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: payment-api
          path: .
          format: "ALL"
          out: reports
          args: ${{ steps.owasp-args.outputs.value }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-scheduled

      - name: Upload full OWASP reports (HTML + JSON + SARIF)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-full-report-${{ github.run_id }}
          path: reports/
          retention-days: 30

  # ── 2. Trivy — scan the latest published Docker image ─────────────────────
  trivy-image-scan:
    name: Trivy Container Scan (latest image)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image from GHCR
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Scan with Trivy (all severities)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: "false"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-scheduled

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image-scan-${{ github.run_id }}
          path: trivy-image.sarif
          retention-days: 30

  # ── 3. Trivy — scan the repository filesystem (secrets, misconfigs, IaC) ───
  trivy-repo-scan:
    name: Trivy Repository & Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Scan repository with Trivy (filesystem mode)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-repo.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          scanners: vuln,secret,misconfig

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-filesystem

      - name: Upload Trivy filesystem SARIF as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-repo-scan-${{ github.run_id }}
          path: trivy-repo.sarif
          retention-days: 30
