name: Security — Scheduled Deep Scan

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# One run at a time — if a scheduled run is still in progress when the next
# schedule fires (or a manual dispatch arrives), queue rather than cancel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Full OWASP Dependency-Check (all severities reported) ────────────────
  owasp-full-scan:
    name: OWASP Full Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Cache OWASP NVD data directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Set OWASP Dependency-Check arguments
        id: owasp-args
        shell: bash
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS="--enableRetired --enableExperimental"
          if [ -n "$NVD_KEY" ]; then
            ARGS="$ARGS --nvdApiKey $NVD_KEY"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run OWASP Dependency-Check (all severities)
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: payment-api
          path: .
          format: "ALL"
          args: ${{ steps.owasp-args.outputs.value }} --out reports

      - name: Summarise OWASP findings
        if: always()
        run: |
          if [ -f reports/dependency-check-report.sarif ]; then
            TOTAL=$(jq '[.runs[].results[]] | length' \
              reports/dependency-check-report.sarif 2>/dev/null || echo "?")
            {
              echo "### OWASP Dependency-Check"
              echo "**Total findings (all severities):** ${TOTAL}"
              echo ""
              echo "Full report available in the workflow artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-scheduled

      - name: Upload full OWASP reports (HTML + JSON + SARIF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: owasp-full-report-${{ github.run_id }}
          path: reports/
          retention-days: 30

  # ── 2. Trivy — scan the latest published Docker image ─────────────────────
  trivy-image-scan:
    name: Trivy Container Scan (latest image)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If CD has never run the ':latest' tag won't exist yet — skip gracefully.
      # Expression moved to env var to prevent shell injection.
      - name: Pull latest image from GHCR
        id: pull-image
        continue-on-error: true
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: docker pull "${IMAGE_REPO}:latest"

      - name: Skip scan — image not available
        if: steps.pull-image.outcome == 'failure'
        run: |
          {
            echo "### Trivy Container Scan — Skipped"
            echo "The \`latest\` tag has not been published yet (CD has not run)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Scheduled scan reports ALL severities (including unfixed) for full
      # visibility — this is monitoring/audit, not a merge gate.
      - name: Scan with Trivy (all severities)
        if: steps.pull-image.outcome == 'success'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        with:
          image-ref: ${{ env.IMAGE_REPO }}:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: "false"

      - name: Summarise Trivy container scan findings
        if: steps.pull-image.outcome == 'success'
        run: |
          if [ -f trivy-image.sarif ]; then
            TOTAL=$(jq '[.runs[].results[]] | length' trivy-image.sarif 2>/dev/null || echo "?")
            {
              echo "### Trivy Container Scan"
              echo "**Total findings (CRITICAL+HIGH+MEDIUM, including unfixed):** ${TOTAL}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        if: steps.pull-image.outcome == 'success'
        with:
          sarif_file: trivy-image.sarif
          category: trivy-scheduled

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pull-image.outcome == 'success'
        with:
          name: trivy-image-scan-${{ github.run_id }}
          path: trivy-image.sarif
          retention-days: 30

  # ── 3. Trivy — scan the repository filesystem (secrets, misconfigs, IaC) ───
  trivy-repo-scan:
    name: Trivy Repository & Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Scan repository with Trivy (filesystem mode)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-repo.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          scanners: vuln,secret,misconfig

      - name: Summarise Trivy repository scan findings
        if: always()
        run: |
          if [ -f trivy-repo.sarif ]; then
            TOTAL=$(jq '[.runs[].results[]] | length' trivy-repo.sarif 2>/dev/null || echo "?")
            {
              echo "### Trivy Repository Scan"
              echo "**Total findings (vuln + secrets + misconfig, CRITICAL–MEDIUM):** ${TOTAL}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        if: always()
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-filesystem

      - name: Upload Trivy filesystem SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-repo-scan-${{ github.run_id }}
          path: trivy-repo.sarif
          retention-days: 30
