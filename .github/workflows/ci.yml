name: CI — Build, Test & Scan

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [master]
  schedule:
    # Weekly cold build (Monday 03:00 UTC) — forces apt-get upgrade to run
    # against fresh base images, ensuring security patches are not served stale
    # from the GHA Docker layer cache.
    - cron: '0 3 * * 1'

# Cancel any in-flight run for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions — individual jobs escalate only what they need
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Xmx1024m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Compile · Test · Enforce JaCoCo ≥95% line coverage ──────────────────
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write          # dorny/test-reporter needs this to create Check Runs
      pull-requests: write   # dorny/test-reporter annotates PR diffs with failures

    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build, run all tests, and enforce JaCoCo threshold
        run: |
          mvn --batch-mode --no-transfer-progress clean verify \
              -Dspring.profiles.active=test

      - name: Summarise test results
        if: always()
        run: |
          REPORT_DIR="target/surefire-reports"
          if compgen -G "${REPORT_DIR}/*.xml" > /dev/null 2>&1; then
            TESTS=$(grep -rh 'tests="' "${REPORT_DIR}"/*.xml \
              | grep -oP 'tests="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            FAILURES=$(grep -rh 'failures="' "${REPORT_DIR}"/*.xml \
              | grep -oP 'failures="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            ERRORS=$(grep -rh 'errors="' "${REPORT_DIR}"/*.xml \
              | grep -oP 'errors="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            SKIPPED=$(grep -rh 'skipped="' "${REPORT_DIR}"/*.xml \
              | grep -oP 'skipped="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            PASSED=$(( TESTS - FAILURES - ERRORS - SKIPPED ))
            {
              echo "### Test Results"
              echo "| Status   | Count |"
              echo "|----------|-------|"
              echo "| Passed   | ${PASSED} |"
              echo "| Failed   | ${FAILURES} |"
              echo "| Errors   | ${ERRORS} |"
              echo "| Skipped  | ${SKIPPED} |"
              echo "| **Total** | **${TESTS}** |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish JUnit test results as Check Run
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: "Test Results"
          path: "target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: "false"

      - name: Upload JaCoCo HTML coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload application JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payment-api-jar
          path: target/payment-api-*.jar
          retention-days: 7
          if-no-files-found: error

  # ── 2. CodeQL SAST — static analysis for security vulnerabilities ────────────
  # Runs in parallel with build-and-test — CodeQL instruments its own build.
  # Detects: SQL injection, path traversal, unsafe deserialization, XSS, etc.
  codeql-analysis:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read          # required by codeql-action to read workflow metadata
      contents: read
      security-events: write # upload results to GitHub Security tab

    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          languages: java
          # '+' prefix extends the default query set with ~50 additional security
          # checks including injection, path traversal, and crypto weaknesses.
          queries: +security-extended

      # Build must run between init and analyze so CodeQL can instrument it.
      # Compile-only is sufficient — CodeQL analyses bytecode, not test results.
      - name: Build for CodeQL analysis
        run: mvn --batch-mode --no-transfer-progress compile -q

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          category: codeql-java

  # ── 3. Trivy filesystem scan — secrets & misconfigs on every push ───────────
  # Runs in parallel (no dependency on build-and-test).
  # Catches hardcoded secrets, vulnerable dependencies, and IaC misconfigurations
  # before they reach a built image or a production deployment.
  trivy-fs-scan:
    name: Trivy Filesystem & Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # Secret scan: fail the build immediately if any secret pattern is found.
      # This is a hard gate — committed secrets are always wrong.
      - name: Scan for hardcoded secrets (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          scanners: secret

      # Vulnerability + misconfiguration scan: informational, SARIF upload only.
      # Enforcement is handled by the container scan (job 4) and OWASP (job 5).
      - name: Scan for CVEs and misconfigurations (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          scanners: vuln,misconfig

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem-ci

      - name: Summarise filesystem scan findings
        if: always()
        run: |
          if [ -f trivy-fs.sarif ]; then
            TOTAL=$(jq '[.runs[].results[]] | length' trivy-fs.sarif 2>/dev/null || echo "?")
            echo "**Trivy filesystem findings (CVE + misconfig, CRITICAL–MEDIUM): ${TOTAL}**" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy filesystem SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 14

  # ── 4. Docker build + Trivy CVE scan (runs after tests pass) ────────────────
  docker-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Docker image (local, no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          tags: payment-api:${{ github.sha }}
          build-args: |
            SECURITY_PATCH_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'schedule' && 'type=gha,mode=max' || '' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true

      # Gate: fail if there are CRITICAL or HIGH CVEs that have a fix available.
      # ignore-unfixed=true skips CVEs with no patch yet (nothing actionable).
      # When this fails, update the base image or vulnerable dependency.
      - name: Scan image with Trivy (CRITICAL & HIGH CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: payment-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"          # fail on fixable CRITICAL/HIGH CVEs
          ignore-unfixed: "true"  # skip CVEs with no available fix

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Summarise Trivy container scan findings
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            TOTAL=$(jq '[.runs[].results[]] | length' trivy-results.sarif 2>/dev/null || echo "?")
            echo "**Trivy container findings (CRITICAL+HIGH, fixable only): ${TOTAL}**" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

  # ── 5. OWASP Dependency-Check for known CVEs in Maven deps ─────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 40

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Cache OWASP NVD data directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      # Build args conditionally — passing --nvdApiKey with an empty value
      # causes the tool to exit with "Missing argument for option".
      - name: Set OWASP Dependency-Check arguments
        id: owasp-args
        shell: bash
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Fail on CVSS ≥ 7.0 (High severity and above).
          # This is appropriate for a payment API where HIGH vulnerabilities
          # in direct dependencies represent real exploitability risk.
          ARGS="--failOnCVSS 7 --enableRetired"
          if [ -n "$NVD_KEY" ]; then
            ARGS="$ARGS --nvdApiKey $NVD_KEY"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: payment-api
          path: .
          format: SARIF
          args: ${{ steps.owasp-args.outputs.value }} --out reports

      - name: Summarise OWASP findings
        if: always()
        run: |
          if [ -f reports/dependency-check-report.sarif ]; then
            TOTAL=$(jq '[.runs[].results[]] | length' \
              reports/dependency-check-report.sarif 2>/dev/null || echo "?")
            echo "**OWASP Dependency-Check findings: ${TOTAL}**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload full OWASP HTML/SARIF report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: owasp-report
          path: reports/
          retention-days: 14
