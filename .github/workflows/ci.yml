name: CI — Build, Test & Scan

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [master]

# Cancel any in-flight run for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions — individual jobs escalate only what they need
permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  # Limit Maven JVM heap; -XX:TieredStopAtLevel=1 speeds up CI compilations
  MAVEN_OPTS: "-Xmx1024m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Compile · Test · Enforce JaCoCo ≥70% line coverage ──────────────────
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write          # dorny/test-reporter needs this to create Check Runs
      pull-requests: write   # dorny/test-reporter annotates PR diffs with failures

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven         # Caches ~/.m2 keyed on **/pom.xml hash

      - name: Build, run all tests, and enforce JaCoCo threshold
        run: |
          mvn --batch-mode --no-transfer-progress clean verify \
              -Dspring.profiles.active=test

      - name: Publish JUnit test results as Check Run
        uses: dorny/test-reporter@v1
        if: always()           # Run even if tests fail so results are always published
        with:
          name: "Test Results"
          path: "target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: "false"   # Don't fail workflow if reporter itself errors (e.g. fork PRs)

      - name: Upload JaCoCo HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: payment-api-jar
          path: target/payment-api-*.jar
          retention-days: 7
          if-no-files-found: error

  # ── 2. Docker build + Trivy CVE scan (runs in parallel with job 3) ──────────
  docker-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write   # Required to upload SARIF to the Security tab

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (local, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: payment-api:${{ github.sha }}
          # Reuse GitHub Actions cache for faster layer caching
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true            # Load into local Docker daemon for Trivy

      - name: Scan image with Trivy (CRITICAL & HIGH CVEs)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: payment-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # Report findings; do not fail the build here
          ignore-unfixed: "true"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Upload Trivy SARIF as artifact (for download/review)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

  # ── 3. OWASP Dependency-Check for known CVEs in Maven deps ─────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 40        # NVD database download can be slow (several minutes)

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Cache the NVD database between runs to speed up subsequent checks
      - name: Cache OWASP NVD data directory
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: payment-api
          path: .
          format: SARIF
          out: reports
          # Fail only on CVSS ≥9 (CRITICAL); adjust as needed.
          # To speed up NVD downloads, add secret NVD_API_KEY in repo settings.
          # See: https://nvd.nist.gov/developers/request-an-api-key
          args: >
            --failOnCVSS 9
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload full OWASP HTML/SARIF report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/
          retention-days: 14
