name: CI — Build, Test & Scan

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [master]

# Cancel any in-flight run for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions — individual jobs escalate only what they need
permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  MAVEN_OPTS: "-Xmx1024m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Compile · Test · Enforce JaCoCo ≥70% line coverage ──────────────────
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write          # dorny/test-reporter needs this to create Check Runs
      pull-requests: write   # dorny/test-reporter annotates PR diffs with failures

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build, run all tests, and enforce JaCoCo threshold
        run: |
          mvn --batch-mode --no-transfer-progress clean verify \
              -Dspring.profiles.active=test

      - name: Publish JUnit test results as Check Run
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: "Test Results"
          path: "target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: "false"

      - name: Upload JaCoCo HTML coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: payment-api-jar
          path: target/payment-api-*.jar
          retention-days: 7
          if-no-files-found: error

  # ── 2. Docker build + Trivy CVE scan (runs in parallel with job 3) ──────────
  docker-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (local, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: payment-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Scan image with Trivy (CRITICAL & HIGH CVEs)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: payment-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: "true"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

  # ── 3. OWASP Dependency-Check for known CVEs in Maven deps ─────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 40

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Cache OWASP NVD data directory
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      # Build args conditionally — passing --nvdApiKey with an empty value
      # causes the tool to exit immediately with "Missing argument for option".
      # The NVD_API_KEY secret is optional; without it the tool still works
      # but NVD database downloads are rate-limited and slower.
      - name: Set OWASP Dependency-Check arguments
        id: owasp-args
        shell: bash
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS="--failOnCVSS 9 --enableRetired"
          if [ -n "$NVD_KEY" ]; then
            ARGS="$ARGS --nvdApiKey $NVD_KEY"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: payment-api
          path: .
          format: SARIF
          out: reports
          args: ${{ steps.owasp-args.outputs.value }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload full OWASP HTML/SARIF report as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-report
          path: reports/
          retention-days: 14
