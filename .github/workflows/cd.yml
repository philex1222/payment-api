name: CD — Publish & Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Build & push Docker image to GHCR ────────────────────────────────────
  publish-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tags:   ${{ steps.meta.outputs.tags }}
      # Short SHA tag used as the pinned image.tag value in Helm
      image-tag:    ${{ steps.short-sha.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: short-sha
        run: echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=payment-api
            org.opencontainers.image.description=Spring Boot Payment Processing API
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image to GHCR
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Write image summary
        run: |
          echo "### Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ steps.short-sha.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-image
    timeout-minutes: 15
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production'))

    outputs:
      # 'true' only when KUBE_CONFIG was set and kubectl/helm steps actually ran
      deployed: ${{ steps.check-cluster.outputs.configured }}

    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check cluster credentials
        id: check-cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Staging Deployment — Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ \`KUBE_CONFIG\` secret not set in the **staging** environment." >> "$GITHUB_STEP_SUMMARY"
            echo "Add a base64-encoded kubeconfig to enable Kubernetes deployments." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.check-cluster.outputs.configured == 'true'
        uses: azure/setup-helm@v5
        with:
          version: "3.16.3"

      # ── Configure kubectl access ─────────────────────────────────────────
      # Set KUBE_CONFIG secret in the GitHub "staging" environment with the
      # base64-encoded kubeconfig for the staging cluster.
      - name: Configure kubectl
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create GHCR pull secret (idempotent)
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            --namespace=payment-staging \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Helm diff (dry-run preview)
        if: steps.check-cluster.outputs.configured == 'true'
        # Requires the helm-diff plugin; install it once per runner environment.
        # If the plugin is not available the step is skipped gracefully.
        continue-on-error: true
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version 3.9.9 2>/dev/null || true
          helm diff upgrade payment-api ./helm/payment-api \
            -f helm/payment-api/values-staging.yaml \
            --set image.tag="${{ needs.publish-image.outputs.image-tag }}" \
            --namespace payment-staging \
            --allow-unreleased \
            --no-color 2>&1 | tee helm-diff-staging.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat helm-diff-staging.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Helm upgrade — Staging
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          helm upgrade --install payment-api ./helm/payment-api \
            -f helm/payment-api/values-staging.yaml \
            --set image.tag="${{ needs.publish-image.outputs.image-tag }}" \
            --namespace payment-staging \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --wait \
            --history-max 5

      - name: Verify rollout
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/payment-api \
            --namespace payment-staging \
            --timeout=5m

      - name: Write staging deployment summary
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          echo "### Staging Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | staging |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ needs.publish-image.outputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image digest | \`${{ needs.publish-image.outputs.image-digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run number | ${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Deploy to Production ─────────────────────────────────────────────────
  # Production deploys are MANUAL ONLY (workflow_dispatch) and require:
  #   1. The workflow was explicitly triggered with environment=production
  #   2. Staging was actually deployed (KUBE_CONFIG was set in staging env)
  #   3. Required reviewers approved in the `production` GitHub Environment:
  #      Repo Settings → Environments → production → Required reviewers
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production' &&
      needs.deploy-staging.outputs.deployed == 'true'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check cluster credentials
        id: check-cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Production Deployment — Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ \`KUBE_CONFIG\` secret not set in the **production** environment." >> "$GITHUB_STEP_SUMMARY"
            echo "Add a base64-encoded kubeconfig to enable Kubernetes deployments." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.check-cluster.outputs.configured == 'true'
        uses: azure/setup-helm@v5
        with:
          version: "3.16.3"

      - name: Configure kubectl
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create GHCR pull secret (idempotent)
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            --namespace=payment-prod \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Helm diff (dry-run preview)
        if: steps.check-cluster.outputs.configured == 'true'
        continue-on-error: true
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version 3.9.9 2>/dev/null || true
          helm diff upgrade payment-api ./helm/payment-api \
            -f helm/payment-api/values-prod.yaml \
            --set image.tag="${{ needs.publish-image.outputs.image-tag }}" \
            --namespace payment-prod \
            --allow-unreleased \
            --no-color 2>&1 | tee helm-diff-prod.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat helm-diff-prod.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Helm upgrade — Production
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          helm upgrade --install payment-api ./helm/payment-api \
            -f helm/payment-api/values-prod.yaml \
            --set image.tag="${{ needs.publish-image.outputs.image-tag }}" \
            --namespace payment-prod \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --wait \
            --history-max 5

      - name: Verify rollout
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/payment-api \
            --namespace payment-prod \
            --timeout=5m

      - name: Write production deployment summary
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          echo "### Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ needs.publish-image.outputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image digest | \`${{ needs.publish-image.outputs.image-digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run number | ${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployed by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
