name: CD — Publish & Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Build & push Docker image to GHCR ────────────────────────────────────
  publish-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tags:   ${{ steps.meta.outputs.tags }}
      # Short SHA tag used as the pinned image.tag value in Helm
      image-tag:    ${{ steps.short-sha.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Use the $GITHUB_SHA builtin env var — avoids injecting the expression
      # directly into a shell command (defence-in-depth against injection).
      - name: Compute short SHA tag
        id: short-sha
        run: echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=payment-api
            org.opencontainers.image.description=Spring Boot Payment Processing API
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image to GHCR
        id: build-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SECURITY_PATCH_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # All GitHub expressions are moved into env vars before the shell runs.
      # This prevents expression values from being interpreted as shell code.
      - name: Write image summary
        env:
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_TAG: ${{ steps.short-sha.outputs.tag }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Docker Image Published"
            echo ""
            echo "**Digest:** \`${IMAGE_DIGEST}\`"
            echo "**Tag:** \`${IMAGE_TAG}\`"
            echo ""
            echo "**All tags:**"
            echo '```'
            echo "${IMAGE_TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-image
    timeout-minutes: 15
    permissions:
      contents: read

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production'))

    outputs:
      # 'true' only when KUBE_CONFIG was set and kubectl/helm steps actually ran
      deployed: ${{ steps.check-cluster.outputs.configured }}

    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check cluster credentials
        id: check-cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging Deployment — Skipped"
              echo "KUBE_CONFIG secret not set in the **staging** environment."
              echo "Add a base64-encoded kubeconfig to enable Kubernetes deployments."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.check-cluster.outputs.configured == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.16.3"

      # ── Configure kubectl access ─────────────────────────────────────────
      # Set KUBE_CONFIG secret in the GitHub "staging" environment with the
      # base64-encoded kubeconfig for the staging cluster.
      - name: Configure kubectl
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create GHCR pull secret (idempotent)
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="${GHCR_PAT}" \
            --namespace=payment-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm diff (dry-run preview)
        if: steps.check-cluster.outputs.configured == 'true'
        # Requires the helm-diff plugin; install it once per runner environment.
        # If the plugin is not available the step is skipped gracefully.
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
        run: |
          helm plugin install https://github.com/databus23/helm-diff \
            --version 3.9.9 2>/dev/null || true
          helm diff upgrade payment-api ./helm/payment-api \
            -f helm/payment-api/values-staging.yaml \
            --set image.tag="${IMAGE_TAG}" \
            --namespace payment-staging \
            --allow-unreleased \
            --no-color 2>&1 | tee helm-diff-staging.txt
          {
            echo '```'
            cat helm-diff-staging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Helm upgrade — Staging
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
        run: |
          helm upgrade --install payment-api ./helm/payment-api \
            -f helm/payment-api/values-staging.yaml \
            --set image.tag="${IMAGE_TAG}" \
            --namespace payment-staging \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --wait \
            --history-max 5

      - name: Verify rollout
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/payment-api \
            --namespace payment-staging \
            --timeout=5m

      - name: Smoke test — health endpoint
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          HEALTH_URL="${STAGING_URL:-http://payment-api.payment-staging.svc.cluster.local:8080}/actuator/health"
          echo "Checking health at: $HEALTH_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(kubectl exec deploy/payment-api -n payment-staging -- \
              wget -qO- --timeout=5 http://localhost:8080/actuator/health 2>/dev/null \
              | grep -o '"status":"[A-Z]*"' | head -1 || echo "")
            if echo "$STATUS" | grep -q '"UP"'; then
              echo "Health check passed: $STATUS"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Write staging deployment summary
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          {
            echo "### Staging Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | staging |"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Image digest | \`${IMAGE_DIGEST}\` |"
            echo "| Run number | ${GITHUB_RUN_NUMBER} |"
            echo "| Triggered by | ${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Deploy to Production ─────────────────────────────────────────────────
  # Production deploys are MANUAL ONLY (workflow_dispatch) and require:
  #   1. The workflow was explicitly triggered with environment=production
  #   2. Staging was actually deployed (KUBE_CONFIG was set in staging env)
  #   3. Required reviewers approved in the `production` GitHub Environment:
  #      Repo Settings → Environments → production → Required reviewers
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    timeout-minutes: 15
    permissions:
      contents: read

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production' &&
      needs.deploy-staging.outputs.deployed == 'true'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check cluster credentials
        id: check-cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Production Deployment — Skipped"
              echo "KUBE_CONFIG secret not set in the **production** environment."
              echo "Add a base64-encoded kubeconfig to enable Kubernetes deployments."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.check-cluster.outputs.configured == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.16.3"

      - name: Configure kubectl
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create GHCR pull secret (idempotent)
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="${GHCR_PAT}" \
            --namespace=payment-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm diff (dry-run preview)
        if: steps.check-cluster.outputs.configured == 'true'
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
        run: |
          helm plugin install https://github.com/databus23/helm-diff \
            --version 3.9.9 2>/dev/null || true
          helm diff upgrade payment-api ./helm/payment-api \
            -f helm/payment-api/values-prod.yaml \
            --set image.tag="${IMAGE_TAG}" \
            --namespace payment-prod \
            --allow-unreleased \
            --no-color 2>&1 | tee helm-diff-prod.txt
          {
            echo '```'
            cat helm-diff-prod.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Helm upgrade — Production
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
        run: |
          helm upgrade --install payment-api ./helm/payment-api \
            -f helm/payment-api/values-prod.yaml \
            --set image.tag="${IMAGE_TAG}" \
            --namespace payment-prod \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --wait \
            --history-max 5

      - name: Verify rollout
        if: steps.check-cluster.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/payment-api \
            --namespace payment-prod \
            --timeout=5m

      - name: Write production deployment summary
        if: steps.check-cluster.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          {
            echo "### Production Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | production |"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Image digest | \`${IMAGE_DIGEST}\` |"
            echo "| Run number | ${GITHUB_RUN_NUMBER} |"
            echo "| Deployed by | ${GITHUB_ACTOR} |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
