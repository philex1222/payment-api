name: CD — Publish & Deploy

# Triggered only on pushes to master (after the CI workflow has validated the commit).
# IMPORTANT: Configure a branch protection rule on master that requires the CI workflow
# to pass before merging — this ensures CD only deploys code that has passed all tests.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  # Allow manual triggering for hotfixes or re-deployments
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

# Never cancel an in-flight deployment — let it finish to avoid a half-deployed state
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── 1. Build the Docker image, push to GitHub Container Registry (GHCR) ────
  publish-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write        # Required to push to GHCR
      attestations: write    # Required for SBOM/provenance attestation
      id-token: write        # Required for provenance signing

    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      primary-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces tags:
      #   ghcr.io/<owner>/payment-api:sha-<short-sha>
      #   ghcr.io/<owner>/payment-api:latest          (master only)
      #   ghcr.io/<owner>/payment-api:build-<run_num> (master only)
      - name: Extract Docker image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-${{ github.run_number }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=payment-api
            org.opencontainers.image.description=Spring Boot Payment Processing API
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image to GHCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true   # Attach SLSA provenance attestation
          sbom: true         # Attach Software Bill of Materials (SBOM)

      - name: Output published image reference
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── 2. Deploy to Staging ────────────────────────────────────────────────────
  #
  # The `staging` GitHub Environment can be configured in:
  #   Repo Settings → Environments → staging
  # to add protection rules (e.g. specific reviewers, wait timers).
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-image
    timeout-minutes: 15
    # Skip staging if manual dispatch targeted production directly
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production'))

    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}    # Set STAGING_URL in repo/environment variables

    steps:
      - name: Checkout source code (for docker-compose reference)
        uses: actions/checkout@v4

      - name: Deploy to staging server
        # ── Replace this step with your actual deployment mechanism ──────────
        # Examples:
        #
        # Option A — SSH + Docker (VPS / bare metal):
        #   uses: appleboy/ssh-action@master
        #   with:
        #     host: ${{ secrets.STAGING_HOST }}
        #     username: ${{ secrets.STAGING_USER }}
        #     key: ${{ secrets.STAGING_SSH_KEY }}
        #     script: |
        #       docker pull ghcr.io/${{ github.repository }}:sha-$(echo ${{ github.sha }} | cut -c1-7)
        #       cd /opt/payment-api
        #       IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7) docker compose up -d app
        #       docker image prune -f
        #
        # Option B — Kubernetes:
        #   kubectl set image deployment/payment-api \
        #     payment-api=ghcr.io/${{ github.repository }}@${{ needs.publish-image.outputs.image-digest }}
        #
        # Option C — AWS ECS:
        #   aws ecs update-service --cluster payment-cluster --service payment-api --force-new-deployment
        # ─────────────────────────────────────────────────────────────────────
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
          IMAGE_TAGS: ${{ needs.publish-image.outputs.image-tags }}
        run: |
          echo "Deploying to STAGING environment"
          echo "Image digest: $IMAGE_DIGEST"
          echo "Image tags:   $IMAGE_TAGS"
          echo ""
          echo "TODO: Replace this step with your deployment command."
          echo "See the comments above for common deployment patterns."

      - name: Write staging deployment summary
        run: |
          echo "### Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Image digest | \`${{ needs.publish-image.outputs.image-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  # ── 3. Deploy to Production ─────────────────────────────────────────────────
  #
  # IMPORTANT: Configure the `production` GitHub Environment with required reviewers
  # so that this job waits for a manual approval before proceeding:
  #   Repo Settings → Environments → production → Required reviewers → Add reviewer(s)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    timeout-minutes: 15
    # For manual dispatch, allow targeting production directly (still requires approval gate)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'production')

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}    # Set PRODUCTION_URL in repo/environment variables

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to production server
        # ── Replace this step with your actual deployment mechanism ──────────
        # Same patterns as staging — see deploy-staging job above.
        # Use the same image digest that was deployed to (and validated on) staging.
        # ─────────────────────────────────────────────────────────────────────
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
          IMAGE_TAGS: ${{ needs.publish-image.outputs.image-tags }}
        run: |
          echo "Deploying to PRODUCTION environment"
          echo "Image digest: $IMAGE_DIGEST"
          echo "Image tags:   $IMAGE_TAGS"
          echo ""
          echo "TODO: Replace this step with your deployment command."

      - name: Write production deployment summary
        run: |
          echo "### Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Image digest | \`${{ needs.publish-image.outputs.image-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
