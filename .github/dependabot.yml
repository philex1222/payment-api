version: 2
updates:
  # ── Maven dependencies ──────────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    # Group all patch and minor Spring Boot updates into a single PR to reduce noise
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
          - "org.springframework.security:*"
      resilience4j:
        patterns:
          - "io.github.resilience4j:*"
      jjwt:
        patterns:
          - "io.jsonwebtoken:*"

  # ── Docker base images (Dockerfile) ────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    labels:
      - dependencies
      - docker

  # ── GitHub Actions workflow dependencies ───────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    labels:
      - dependencies
      - github-actions
