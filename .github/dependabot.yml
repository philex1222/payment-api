version: 2
updates:
  # ── Maven dependencies ──────────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - java
    assignees:
      - PhilipW1222
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Block major version bumps for all dependencies — major updates require
    # deliberate migration work and must not be applied automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group minor+patch updates for noisy dependency families into a single PR
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
          - "org.springframework.security:*"
        update-types:
          - "minor"
          - "patch"
      resilience4j:
        patterns:
          - "io.github.resilience4j:*"
        update-types:
          - "minor"
          - "patch"
      jjwt:
        patterns:
          - "io.jsonwebtoken:*"
        update-types:
          - "minor"
          - "patch"

  # ── Docker base images (Dockerfile) ────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
    assignees:
      - PhilipW1222
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Block major base-image version bumps (e.g. Java 17 → 21 or 25);
    # those are intentional decisions that need manual review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions workflow dependencies ───────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    rebase-strategy: auto
    labels:
      - dependencies
      - github-actions
    assignees:
      - PhilipW1222
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Allow minor/patch action updates; major action versions (e.g. v3 → v4)
    # require manual testing since they can change inputs/outputs/runtime.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
