apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "payment-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep at least one pod available during rollout (safe for single-replica dev envs too)
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Roll pods when the ConfigMap content changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "payment-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "payment-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      # ── Security context (pod level) ────────────────────────────────────────
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # ── Graceful shutdown ────────────────────────────────────────────────────
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      # ── Topology spread (HA) ─────────────────────────────────────────────────
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "payment-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # ── Container security context ─────────────────────────────────────
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment variables ──────────────────────────────────────────
          env:
            {{- toYaml .Values.env | nindent 12 }}

          # ── Probes ────────────────────────────────────────────────────────
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          # ── Resources ─────────────────────────────────────────────────────
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # ── Lifecycle ─────────────────────────────────────────────────────
          lifecycle:
            {{- toYaml .Values.lifecycle | nindent 12 }}

          # ── Volume mounts ─────────────────────────────────────────────────
          volumeMounts:
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}

      # ── Volumes ─────────────────────────────────────────────────────────────
      volumes:
        {{- toYaml .Values.extraVolumes | nindent 8 }}

      # ── Node scheduling ─────────────────────────────────────────────────────
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
